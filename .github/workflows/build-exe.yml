name: Build exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build:exe
      - uses: actions/upload-artifact@v4
        with:
          name: CakeDefense-windows
          path: dist/CakeDefense.exe
